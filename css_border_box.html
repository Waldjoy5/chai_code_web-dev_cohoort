<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border box</title>
    <style>
        *{
            box-sizing: border-box;
        }
        div{
            height:150px;
            width:150px;
            padding:40px;
            border:15px solid black;
        }
    </style>
</head>
<body>
    <div  style="margin-bottom:50px">content</div>
    <div style="margin-top:50px">content 2</div>
</body>
</html>
