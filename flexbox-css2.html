<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Fix</title>
    <style>
        div {
            padding: 5px;
            border: 2px solid black;
        }
        .parent {
            background-color: aquamarine;
            height: 500px;
            display: flex; 
             flex-direction: column;  
            justify-content:center ; 
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;

        }
        .child {
            background-color: whitesmoke;
          width: 100px; 
            height: 30px;
        }
        #cl-1{
            flex:15;
            background-color:purple;
            order:3;
        }
        #cl-2 {
            background-color: blue;
            flex: 10;
            order:2;
        }
        #cl-3 {
            flex: 5;
            background-color: red; 
            order:1;
        }
        
        #cl-4{
            flex:3;
            background-color: blanchedalmond;
          order:0;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div id="cl-1" class="child">ITEM 1</div>
         <div id="cl-2" class="child">ITEM 2</div> 
        <div id="cl-3" class="child">ITEM 3</div>
        <div id="cl-4" class="child">ITEM 4</div>
    </div>
</body>
</html>
